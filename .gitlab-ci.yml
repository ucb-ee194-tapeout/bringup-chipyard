spec:
  inputs:
    TestSuitePath:
      description: "Path of the Test Suite from the Chipyard Repo ROOT. EXAMPLE -> CI_CD_TEST_SUITES/saturn"
      default: "CI_CD_TEST_SUITES/nightly"
    Config:
      description: "Hammer config to use for syn and par (e.g. EE290TapeoutConfig)"
      default: "EE290TapeoutConfig"
    RUN_PD:
      description: "Whether pipeline should run syn, par, etc."
      default: "false"

---
variables:
  TZ: "America/Los_Angeles"

.script_helpers: &script_helpers |
  export PS4="+ CMD: "
  start_section() { 
    local safe_id="${1//[^a-zA-Z0-9_]/_}"
    printf "\e[0Ksection_start:%s:%s[collapsed=true]\r\e[0K%s\n" "$(date +%s)" "$safe_id" "$2"
    set -x
  }
  end_section() { 
    { set +x; } 2>/dev/null
    local safe_id="${1//[^a-zA-Z0-9_]/_}"
    printf "\e[0Ksection_end:%s:%s\r\e[0K\n" "$(date +%s)" "$safe_id"
  }

stages:
  - security-check
  - build
  - test
  - par
  - drc
  - metrics
  - notify
  - clean

workflow:
  rules:
    # MR pipelines: Assign a lock based on the target branch.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      variables:
        CONCURRENCY_GROUP: "mr_target_${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"

    # Scheduled Nightly pipelines (PD ENABLED)
    # Locks to a single group so only ONE PD pipeline can run at a time
    - if: $CI_PIPELINE_SOURCE == "schedule" && "$[[ inputs.RUN_PD ]]" == "true"
      variables:
        CONCURRENCY_GROUP: "nightly_pd_lock"

    # Scheduled Nightly pipelines (PD DISABLED)
    # Generates a unique group ID per pipeline
    - if: $CI_PIPELINE_SOURCE == "schedule"
      variables:
        CONCURRENCY_GROUP: "nightly_${CI_PIPELINE_ID}"

    - if: $CI_PIPELINE_SOURCE == "web"
      variables:
        CONCURRENCY_GROUP: "manual_${CI_PIPELINE_ID}"
















# ------------------------------------------------------------------
#                     SECURITY CHECK
# ------------------------------------------------------------------

enforce_ci_integrity:
  interruptible: true
  stage: security-check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    ALLOWED_CI_MODIFIERS: "bandk1451 yrh nicorakela syeon-um henry.wilson"
    GIT_DEPTH: 0
  script:
    - echo "Pipeline triggered by user:$GITLAB_USER_LOGIN"
    - |
      if echo " $ALLOWED_CI_MODIFIERS " | grep -q " $GITLAB_USER_LOGIN "; then
        echo "${GITLAB_USER_LOGIN} is authorized to modify CI and Nightly tests. Moving on..."
        exit 0
      fi
    - echo "${GITLAB_USER_LOGIN} is not authorized to edit CI/Nightly tests. Checking for unauthorized modifications..."
    - git fetch origin $CI_MERGE_REQUEST_TARGET_BRANCH_NAME
    
    - CHANGED_FILES=$(git diff --name-only origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD)
    - |
      if echo "$CHANGED_FILES" | grep -q "^\.gitlab-ci\.yml$"; then
        echo "ERROR: User $GITLAB_USER_LOGIN is not allowed to modify .gitlab-ci.yml in a Merge Request!"
        exit 1
      fi

    - |
      DELETED_CONFS=$(git diff --name-only --diff-filter=D origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD -- CI_CD_TEST_SUITES/nightly | grep "\.conf$" || true)
      if [ ! -z "$DELETED_CONFS" ]; then
        echo "ERROR: The following .conf files have been completely deleted from the nightly suite!"
        echo "$DELETED_CONFS"
        exit 1
      fi      

    - |
      # Get a list of modified .conf files (excluding deletions which we already caught)
      MODIFIED_CONFS=$(git diff --name-only --diff-filter=M origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD -- CI_CD_TEST_SUITES/nightly | grep "\.conf$" || true)
      
      for conf_file in $MODIFIED_CONFS; do
        echo "Verifying test integrity in $conf_file..."
        
        OLD_TESTS=$(git show origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME:$conf_file | grep -v "=" | grep -oP '"\K[^"]+')
        
        NEW_TESTS=$(cat $conf_file | grep -v "=" | grep -oP '"\K[^"]+')
        
        for test in $OLD_TESTS; do
          # -F: fixed strings, -q: quiet, -x: exact line match
          # This ensures we don't accidentally match "vec-conv" inside "vec-conv-3"
          if ! echo "$NEW_TESTS" | grep -Fqx "$test"; then
            echo "ERROR: Test or configuration value '$test' has been removed from $conf_file!"
            exit 1
          fi
        done
      done

    - echo "CI configuration and Nightly tests are secure. Proceeding with the pipeline..."

























# ------------------------------------------------------------------
#                           BUILD
# ------------------------------------------------------------------

build:
  interruptible: true
  stage: build
  script: 
    - *script_helpers
    - echo $CONCURRENCY_GROUP
    - export chipyard=/tools/C/$USER/CI_CD_${CI_PIPELINE_ID}
    - export TARGET_BRANCH="${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
    - source ~/miniforge3/bin/activate
    - source /tools/C/ee194-sp26/bwrc-env.sh
    - |

      if [ -d "${chipyard}" ]; then
        CLEANUP_DIR="/tools/C/$USER/TEMP_RM_DIR_${CI_PIPELINE_ID}_${CI_JOB_ID}"
        echo "WARNING:Existing CI_CD found. Moving to ${CLEANUP_DIR} for removal..."
        mv "${chipyard}" "${CLEANUP_DIR}"
        
        rm -rf "${CLEANUP_DIR}"
      fi

      start_section "ScratchBuild" "Building CI_CD from scratch...."
      cd /tools/C/$USER
      # Redacted: the internal repository URL, PDK group, and PDK plugin are replaced with <internal-chipyard-repo>, <pdk-group>, and <pdk-plugin>, so this job does not run as is.
      git clone <internal-chipyard-repo> ${chipyard}
      chown -R ${USER}:<pdk-group> $chipyard
      find $chipyard -type d -exec chmod g+s {} +
      cd $chipyard
      ./build-setup.sh --use-lean-conda -s 6 -s 7 -s 8 -s 9
      source ./env.sh
      cd vlsi
      rm -rf hammer
      git clone git@github.com:ucb-bar/hammer.git
      pip install -e hammer
      cd ..
      git submodule update --init --recursive vlsi/<pdk-plugin>
      cd vlsi/<pdk-plugin>
      pip install -e .
      cd ../../
      cd vlsi/<pdk-plugin>
      git checkout master
      cd $chipyard
      git submodule deinit -f generators/radiance/
      end_section "ScratchBuild"
      
      cd $chipyard
      source ./env.sh
      
      ROOT_SKIP_PATHS="generators/ara software toolchains tools fpga generators/radiance generators/gemmini generators/cva6"
      echo "SKIPPING PATHS:${ROOT_SKIP_PATHS}"
      
      NESTED_BROKEN_MODS="generators/gemmini/MxQuant-hardware"
      echo "SKIPPING BROKEN MODULES:${NESTED_BROKEN_MODS}"
      
      start_section "Fetching" "FETCHING..."
      git fetch --all
      end_section "Fetching"

      start_section "Branch_Checkout" "Checking out branch:${TARGET_BRANCH}"
      git checkout ${TARGET_BRANCH}
      end_section "Branch_Checkout"

      start_section "Overall_Reset" "RESETTING..."
      git reset --hard origin/${TARGET_BRANCH}
      end_section "Overall_Reset"
      
      start_section "Overall_Clean" "CLEANING..."
      git clean -df
      end_section "Overall_Clean"

      start_section "Fix_Broken_Nested_Submodules" "DISABLING BROKEN MODS..."
      for mod in $NESTED_BROKEN_MODS; do
        PARENT=$(dirname "$mod")
        CHILD=$(basename "$mod")
        
        git submodule update --init "$PARENT"
        SUB_NAME=$(git -C "$PARENT" config -f .gitmodules --get-regexp "^submodule\..*\.path$" "^${CHILD}$" | awk '{print $1}' | sed 's/^submodule\.//;s/\.path$//' | head -n 1) || true
        if [ -z "$SUB_NAME" ]; then
          SUB_NAME="$CHILD"
        fi
        
        git -C "$PARENT" config -f .gitmodules submodule."$SUB_NAME".url "https://dummy.local/repo.git" || true
        git -C "$PARENT" config submodule."$SUB_NAME".update none || true
        { set +x; } 2>/dev/null
        echo "Patched URL and disabled updates for nested broken module: $mod"
        set -x
      done
      end_section "Fix_Broken_Nested_Submodules"
      
      start_section "Disabling_Skip_Paths" "DISABLING SKIP PATHS..."
      for prefix in $ROOT_SKIP_PATHS; do
        git config --file .gitmodules --get-regexp path | grep -E " ${prefix}(/|$)" | awk '{print $1}' | sed 's/\.path$//' | while read -r submod_key; do
          git config "$submod_key.update" none
          { set +x; } 2>/dev/null
          echo "Disabled update for root submodule: $submod_key"
          set -x
        done
      done
      end_section "Disabling_Skip_Paths"

      start_section "Inner_Reset_And_Clean" "RESETTING AND CLEANING..."
      ALL_SKIP_PREFIXES="$ROOT_SKIP_PATHS $NESTED_BROKEN_MODS"
      git submodule foreach --recursive '
        SKIP=0
        for prefix in '"$ALL_SKIP_PREFIXES"'; do
          case "$displaypath" in
            $prefix*) SKIP=1 ;;
          esac
        done
        
        if [ $SKIP -eq 1 ]; then
          { set +x; } 2>/dev/null
          echo "Skipping reset and clean for $displaypath"
          set -x
        else
          git reset --hard
          git clean -df 
          
          for mod in '"$NESTED_BROKEN_MODS"'; do
            PARENT=$(dirname "$mod")
            CHILD=$(basename "$mod")
            if [ "$PARENT" = "$displaypath" ]; then
              git config -f .gitmodules submodule."$CHILD".path "$CHILD"
              git config -f .gitmodules submodule."$CHILD".url "https://dummy.local/repo.git"
              { set +x; } 2>/dev/null
              echo "Re-patched URL for $CHILD in $PARENT after reset"
              set -x
            fi
          done
        fi
      '
      end_section "Inner_Reset_And_Clean"

      start_section "Fix_Tacit" "Explicitly updating tacit submodule..."
      git submodule update --init generators/tacit
      end_section "Fix_Tacit"

      start_section "Force_Submodule_Update" "FORCING SUBMODULE UPDATES..."
      git submodule update --init --recursive --force
      end_section "Force_Submodule_Update"
      
      start_section "Revert_Configurations" "REVERTING SKIPPED CONFIGS..."
      for prefix in $ROOT_SKIP_PATHS; do
        git config --file .gitmodules --get-regexp path | grep -E " ${prefix}(/|$)" | awk '{print $1}' | sed 's/\.path$//' | while read -r submod_key; do
          git config --unset "$submod_key.update" || true
        done
      done
      
      for mod in $NESTED_BROKEN_MODS; do
        PARENT=$(dirname "$mod")
        CHILD=$(basename "$mod")
        git -C "$PARENT" reset HEAD "$CHILD" 2>/dev/null || true
        git -C "$PARENT" checkout -- "$CHILD" 2>/dev/null || true
        { set +x; } 2>/dev/null
        echo "Restored $CHILD in $PARENT index"
        set -x
      done
      end_section "Revert_Configurations"
      
      echo "BUILD FINISHED..."
      pwd

























# ------------------------------------------------------------------
#                     TEST EXECUTION
# ------------------------------------------------------------------

test_execution:
  interruptible: true
  stage: test
  resource_group: sim_${CONCURRENCY_GROUP}
  script:
    - *script_helpers
    - BUILD_DIR=$(pwd)
    - export chipyard=/tools/C/$USER/CI_CD_${CI_PIPELINE_ID}
    - export TARGET_BRANCH="${CI_COMMIT_BRANCH:-$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
    - source ${chipyard}/scripts/CI_CD/setup_CI_CD.sh
    - TODAY=$(date +"%Y-%m-%d")
    - TEST_SUMMARY_LOG=${BUILD_DIR}/log_${TODAY}_${TARGET_BRANCH}.txt
    - JUNIT_XML=${BUILD_DIR}/junit_report.xml

    - export RANDOM_SEED=$((RANDOM * 32768 + RANDOM))
    - echo "Generated Pipeline Random Seed:${RANDOM_SEED}"
    
    - echo "log from project:${CI_PROJECT_PATH}, branch:${TARGET_BRANCH}, job_url:${CI_JOB_URL}" > $TEST_SUMMARY_LOG
    - echo "RANDOM_SEED:${RANDOM_SEED}" >> $TEST_SUMMARY_LOG
    - echo "---------------------------------------" >> $TEST_SUMMARY_LOG
    - echo "TEST SUMMARY" >> $TEST_SUMMARY_LOG
    - echo "---------------------------------------" >> $TEST_SUMMARY_LOG
    - echo '<?xml version="1.0" encoding="UTF-8"?><testsuites>' > $JUNIT_XML

    - pip install torch
    - pip install numba torch

    - |

      TS_PATH="${chipyard}/$[[ inputs.TestSuitePath ]]"
      if [ ! -d "$TS_PATH" ]; then
        echo "Error: Directory $TS_PATH does not exist."
        exit 1
      fi

      CONFIGS=($(ls -1 "$TS_PATH"))
      echo "Found configs:${CONFIGS[@]}"
      mkdir -p $BUILD_DIR/run_logs

      # =========================================================================
      # PHASE 1: PREP AND BUILD THE JOB QUEUE
      # =========================================================================
      start_section "Phase_1" "SETUP COMPLETE. BEGINNING PHASE 1 JOB QUEUEING"

      JOB_QUEUE=()
      
      for conf in "${CONFIGS[@]}"; do
        set -a; source "${chipyard}/$[[ inputs.TestSuitePath ]]/${conf}"; set +a

        if ! grep -q "HW_CONFIG" ${chipyard}/$[[ inputs.TestSuitePath ]]/${conf}; then exit 1; fi
        if ! grep -q "TEST_DIR" ${chipyard}/$[[ inputs.TestSuitePath ]]/${conf}; then exit 1; fi
        if ! grep -q "TEST_TYPE" ${chipyard}/$[[ inputs.TestSuitePath ]]/${conf}; then exit 1; fi
        if ! grep -q "SIM_DIR" ${chipyard}/$[[ inputs.TestSuitePath ]]/${conf}; then exit 1; fi
        if ! grep -q "TESTS" ${chipyard}/$[[ inputs.TestSuitePath ]]/${conf}; then exit 1; fi
        
        if [ "${TEST_TYPE}" == "baremetal" ]; then
          start_section "Build_And_Queue_${conf}" "Pre-building ${HW_CONFIG} and tests for ${conf}..."
          (cd ${chipyard}/${TEST_DIR} && make)
          
          (cd ${chipyard}/${SIM_DIR} && flock ${chipyard}/.scala_build.lock -c "make -j16 CONFIG=\"${HW_CONFIG}\" GEN_COVERAGE=1 LOADMEM=1 BINARY=base_schema debug")
          
          { set +x; } 2>/dev/null
          if [ ${#TESTS[@]} -gt 0 ]; then
            FIRST_TEST="${TESTS[0]}"
            echo "Warming up caches sequentially with first test: ${FIRST_TEST}..."
            (
              set -x
              cd ${chipyard}/${SIM_DIR}
              make -j1 GEN_COVERAGE=1 LOADMEM=1 \
                CONFIG="${HW_CONFIG}" \
                BINARY="${chipyard}/${TEST_DIR}/${FIRST_TEST}.riscv" \
                run-binary-debug \
                SIM_FLAGS="-no-save -debug_access+all -u" \
                < /dev/null > /dev/null 2>&1 || true
            )
          fi

          { set +x; } 2>/dev/null
          echo "Queueing baremetal tests for ${conf}..."
          for test in "${TESTS[@]}"; do
            set -x
            JOB_QUEUE+=("1|baremetal|${conf}|${test}")
          done
          end_section "Build_And_Queue_${conf}"

        elif [ "${TEST_TYPE}" == "chisel" ]; then
          { set +x; } 2>/dev/null
          echo "Pre-building and queueing chisel tests for ${conf}..."
          set -x
          cd ${chipyard}/${TEST_DIR}

          mkdir -p src/test/resources
          
          for file in scripts/*.py; do 
            python3 "$file"
          done

          JOB_QUEUE+=("16|chisel|${conf}|${TESTS[*]}")
        
        else
          echo "ERROR:TEST_TYPE INVALID IN ${conf}"
          exit 1
        fi
      done
      end_section "Phase_1"

      # =========================================================================
      # PHASE 2: DYNAMIC THREAD SCHEDULER (MAX 35 THREADS)
      # =========================================================================
      start_section "Phase_2" "PHASE 1 COMPLETE. BEGINNING PHASE 2 DYNAMIC PARALLEL EXECUTION"

      MAX_THREADS=35
      declare -A RUNNING_PIDS

      for job in "${JOB_QUEUE[@]}"; do
        { set +x; } 2>/dev/null
        IFS='|' read -r weight type conf job_tests <<< "$job"
        
        while true; do
          CURRENT_THREADS=0
          for pid in "${!RUNNING_PIDS[@]}"; do
            if kill -0 "$pid" 2>/dev/null; then
              CURRENT_THREADS=$((CURRENT_THREADS + RUNNING_PIDS[$pid]))
            else
              wait "$pid" 2>/dev/null || true
              unset RUNNING_PIDS[$pid]
            fi
          done
          
          if [ $((CURRENT_THREADS + weight)) -le $MAX_THREADS ]; then
            
            LICENSES_OK=false
            
            LICENSE_OUTPUT=$('/tools/synopsys/flexlm/status' 2>/dev/null | tr -d '\r' | awk '/Users of/ {if(line) print line; line=$0; next} NF==0 {next} line {line=line" "$0} END {if(line) print line}' | grep -i "vcs")
            
            if [ -n "$LICENSE_OUTPUT" ]; then
              LICENSES_OK=true
              FOUND_VALID_COUNT=false
              
              re="Total of ([0-9]+) licenses? issued; +Total of ([0-9]+) licenses? in use"
              
              while IFS= read -r line; do
                if [[ "$line" =~ $re ]]; then
                  FOUND_VALID_COUNT=true
                  issued="${BASH_REMATCH[1]}"
                  in_use="${BASH_REMATCH[2]}"
                  available=$((issued - in_use))
                  
                  if [ "$available" -lt 25 ]; then
                    LICENSES_OK=false
                    break
                  fi
                fi
              done <<< "$LICENSE_OUTPUT"

              if [ "$FOUND_VALID_COUNT" = false ]; then
                LICENSES_OK=false
              fi
            fi

            if [ "$LICENSES_OK" = true ]; then
              break
            fi
          fi
          
          sleep 30
        done
        
        set -a; source "${chipyard}/$[[ inputs.TestSuitePath ]]/${conf}"; set +a

        if [ "$type" == "baremetal" ]; then
          test="$job_tests"
          echo "Dispatching $type job $test from $conf (Threads: $weight) | Active Threads: $((CURRENT_THREADS + weight))/$MAX_THREADS"
          (
            echo
            RUN_DIR="${BUILD_DIR}/run_dirs/run_${conf}_${test}"
            mkdir -p "$RUN_DIR"
            cd "$RUN_DIR"

            SECONDS=0
            START_TS=$(date +%s)
            LOG_FILE="${BUILD_DIR}/run_logs/run_${conf}_${test}.log"
            SUMMARY_FILE="${BUILD_DIR}/run_logs/summary_tmp_${conf}_${test}.txt"
            JUNIT_FILE="${BUILD_DIR}/run_logs/junit_tmp_${conf}_${test}.xml"
            OUT="${chipyard}/${SIM_DIR}/output/chipyard.harness.TestHarness.${HW_CONFIG}/${test}.out"
            FSDB="${RUN_DIR}/${test}.fsdb"
            COVERAGE="${chipyard}/${SIM_DIR}/generated-src/chipyard.harness.TestHarness.${HW_CONFIG}/coverage/${test}.vdb"
            RISCV="${chipyard}/${TEST_DIR}/${test}.riscv"
            
            set -x
            SIM_BIN="${chipyard}/${SIM_DIR}/simv-chipyard.harness-${HW_CONFIG}-debug"

            SIM_EXIT=0
            timeout -s SIGINT 3h $SIM_BIN \
              +permissive \
              +ntb_random_seed=${RANDOM_SEED} \
              +dramsim \
              +dramsim_ini_dir=${chipyard}/generators/testchipip/src/main/resources/dramsim2_ini \
              +max-cycles=50000000 \
              +verbose \
              ${FSDB_ARG} \
              +loadmem="${RISCV}" \
              -cm line+cond+fsm+branch+tgl+assert \
              -cm_name ${test} \
              -cm_dir ${COVERAGE} \
              +permissive-off \
              ${RISCV} < /dev/null 2> >(spike-dasm > "${OUT}") > "${LOG_FILE}" || SIM_EXIT=$?


            if { [ $SIM_EXIT -ne 0 ] || ! grep -Eq "PASSED" "$OUT" 2>/dev/null; }; then
              if [ "$CI_PIPELINE_SOURCE" == "schedule" ]; then
                { set +x; } 2>/dev/null
                echo "Test ${test} failed. Rerunning with FSDB generation enabled..."
                set -x
                
                FSDB_ARG="+fsdbfile=${test}.fsdb"
                SIM_EXIT=0
                
                timeout -s SIGINT 3h $SIM_BIN \
                  +permissive \
                  +ntb_random_seed=${RANDOM_SEED} \
                  +dramsim \
                  +dramsim_ini_dir=${chipyard}/generators/testchipip/src/main/resources/dramsim2_ini \
                  +max-cycles=50000000 \
                  +verbose \
                  ${FSDB_ARG} \
                  +loadmem="${RISCV}" \
                  -cm line+cond+fsm+branch+tgl+assert \
                  -cm_name ${test} \
                  -cm_dir ${COVERAGE} \
                  +permissive-off \
                  ${RISCV} < /dev/null 2> >(spike-dasm > "${OUT}") > "${LOG_FILE}" || SIM_EXIT=$?
              fi
            fi

            
            END_TS=$(date +%s)

            { set +x; } 2>/dev/null

            sed -i 's/\x1B\[[0-9;]*[a-zA-Z]//g' "$LOG_FILE"
            echo "Completed $type job $test from $conf"

            if [ $SIM_EXIT -eq 124 ]; then
              echo "  [ FAIL ] ${test}      Duration:${SECONDS} (TIMEOUT)" > "$SUMMARY_FILE"
              echo "<testcase name=\"${test}\" classname=\"${conf}\" time=\"${SECONDS}\"><properties><property name=\"start_ts\" value=\"${START_TS}\"/><property name=\"end_ts\" value=\"${END_TS}\"/></properties><failure message=\"Test timed out after 3 hours\">Check artifacts:run_logs/run_${conf}_${test}.log</failure></testcase>" > "$JUNIT_FILE"
              [ -f "${FSDB}" ] && mv ${FSDB} ${BUILD_DIR}/run_logs/ 2>/dev/null || true
            elif [ $SIM_EXIT -ne 0 ]; then
              echo "  [ ERROR ] ${test}      Duration:${SECONDS}" > "$SUMMARY_FILE"
              echo "<testcase name=\"${test}\" classname=\"${conf}\" time=\"${SECONDS}\"><properties><property name=\"start_ts\" value=\"${START_TS}\"/><property name=\"end_ts\" value=\"${END_TS}\"/></properties><failure message=\"Test errored\">Check artifacts:run_logs/run_${conf}_${test}.log</failure></testcase>" > "$JUNIT_FILE"
              [ -f "${FSDB}" ] && mv ${FSDB} ${BUILD_DIR}/run_logs/ 2>/dev/null || true
            else
              if [ $SIM_EXIT -eq 0 ] && [ -f "$OUT" ] && grep -Eq "PASSED" "$OUT"; then
                echo "  [ PASS ] ${test}      Duration:${SECONDS}" > "$SUMMARY_FILE"
                echo "<testcase name=\"${test}\" classname=\"${conf}\" time=\"${SECONDS}\"><properties><property name=\"start_ts\" value=\"${START_TS}\"/><property name=\"end_ts\" value=\"${END_TS}\"/></properties></testcase>" > "$JUNIT_FILE"
              else
                echo "  [ FAIL ] ${test}      Duration:${SECONDS}" > "$SUMMARY_FILE"
                echo "<testcase name=\"${test}\" classname=\"${conf}\" time=\"${SECONDS}\"><properties><property name=\"start_ts\" value=\"${START_TS}\"/><property name=\"end_ts\" value=\"${END_TS}\"/></properties><failure message=\"Test failed\">Check artifacts:run_logs/run_${conf}_${test}.log</failure></testcase>" > "$JUNIT_FILE"
                [ -f "${FSDB}" ] && mv ${FSDB} ${BUILD_DIR}/run_logs/
              fi
            fi
            set -x
          ) &
          RUNNING_PIDS[$!]=${weight} 

        elif [ "$type" == "chisel" ]; then
          { set +x; } 2>/dev/null
          echo "Dispatching $type jobs from $conf (Threads: $weight) | Active Threads: $((CURRENT_THREADS + weight))/$MAX_THREADS"
          set -x
          (
            cd ${chipyard}/${SIM_DIR}
            export PATH="$PATH:$(pwd)"
            SECONDS=0
            START_TS=$(date +%s)
            
            MILL_TARGETS="atlas.test.testOnly"
            for t in $job_tests; do
              MILL_TARGETS="${MILL_TARGETS} ${HW_CONFIG}.${t}"
            done

            COMBINED_LOG="${BUILD_DIR}/run_logs/run_${conf}_combined.log"
            MILL_EXIT=0

            timeout 3h ./mill --no-server --disable-ticker -k -j16 $MILL_TARGETS > "$COMBINED_LOG" 2>&1 || MILL_EXIT=$?
            END_TS=$(date +%s)

            { set +x; } 2>/dev/null

            sed -i 's/\x1B\[[0-9;]*[a-zA-Z]//g' "$COMBINED_LOG"
            echo "Completed $type jobs from $conf"

            SUMMARY_FILE="${BUILD_DIR}/run_logs/summary_tmp_${conf}_chisel.txt"
            JUNIT_FILE="${BUILD_DIR}/run_logs/junit_tmp_${conf}_chisel.xml"
            > "$SUMMARY_FILE"
            > "$JUNIT_FILE"

            echo "Chisel Test Suite Duration:${SECONDS}" >> "$SUMMARY_FILE"
            
            for t in $job_tests; do
              if [ -f "$COMBINED_LOG" ] && grep -Eq "${t}=FAILED" "$COMBINED_LOG"; then
                echo "  [ FAIL ] ${t}" >> "$SUMMARY_FILE"
                echo "<testcase name=\"${t}\" classname=\"${conf}\" time=\"${SECONDS}\"><properties><property name=\"start_ts\" value=\"${START_TS}\"/><property name=\"end_ts\" value=\"${END_TS}\"/></properties><failure message=\"Test failed\">Check artifacts:run_logs/run_${conf}_combined.log</failure></testcase>" >> "$JUNIT_FILE"
              elif [ -f "$COMBINED_LOG" ] && grep -Eq "${t}=PASSED" "$COMBINED_LOG"; then
                echo "  [ PASS ] ${t}" >> "$SUMMARY_FILE"
                echo "<testcase name=\"${t}\" classname=\"${conf}\" time=\"${SECONDS}\"><properties><property name=\"start_ts\" value=\"${START_TS}\"/><property name=\"end_ts\" value=\"${END_TS}\"/></properties></testcase>" >> "$JUNIT_FILE"
              else
                echo "  [ ERROR ] ${t}" >> "$SUMMARY_FILE"
                echo "<testcase name=\"${t}\" classname=\"${conf}\" time=\"${SECONDS}\"><properties><property name=\"start_ts\" value=\"${START_TS}\"/><property name=\"end_ts\" value=\"${END_TS}\"/></properties><failure message=\"Test errored\">Check artifacts:run_logs/run_${conf}_combined.log</failure></testcase>" >> "$JUNIT_FILE"
              fi
            done
            set -x
          ) &
          RUNNING_PIDS[$!]=$weight 
        fi
      done

      { set +x; } 2>/dev/null
      for pid in "${!RUNNING_PIDS[@]}"; do
        wait "$pid" 2>/dev/null || true
      done
      set -x

      end_section "Phase_2"

      # =========================================================================
      # PHASE 3: AGGREGATE RESULTS
      # =========================================================================
      start_section "Phase_3" "PHASE 2 COMPLETE. BEGINNING PHASE 3 AGGREGATION"

      FAIL=0

      { set +x; } 2>/dev/null
      for conf in "${CONFIGS[@]}"; do
        set -a; source "${chipyard}/$[[ inputs.TestSuitePath ]]/${conf}"; set +a
        
        echo -e "\n\nTestSuite:${conf}\nHardware Config:${HW_CONFIG}\nTEST_TYPE:${TEST_TYPE}" >> $TEST_SUMMARY_LOG
        echo "<testsuite name=\"${conf}\">" >> $JUNIT_XML

        for tmp_sum in ${BUILD_DIR}/run_logs/summary_tmp_${conf}_*.txt; do
          if [ -f "$tmp_sum" ]; then
            cat "$tmp_sum" >> $TEST_SUMMARY_LOG
            if grep -q "\[ FAIL \]" "$tmp_sum"; then FAIL=1; fi
            if grep -q "\[ ERROR \]" "$tmp_sum"; then FAIL=1; fi
          fi
        done

        for tmp_xml in ${BUILD_DIR}/run_logs/junit_tmp_${conf}_*.xml; do
          if [ -f "$tmp_xml" ]; then
            cat "$tmp_xml" >> $JUNIT_XML
          fi
        done

        if [ "${TEST_TYPE}" == "chisel" ]; then
          set -x
          cd ${chipyard}/${SIM_DIR}/tmp
          echo "aggregrate chisel coverage"
          VDB_DIRS=""
          for test_name in "${TESTS[@]}"; do
            for vdb_path in ${test_name}*/workdir-${test_name}*/coverage.vdb; do
              if [ -d "$vdb_path" ]; then
                VDB_DIRS="${VDB_DIRS} ${vdb_path}"
              else
                echo "Warning: Coverage directory not found -> ${vdb_path}"
              fi
            done
          done
          
          if [ -n "$VDB_DIRS" ]; then
            urg -dir $VDB_DIRS -format text -report "${BUILD_DIR}/run_logs/cov_overall_${conf}" || echo "Coverage generation failed"
          else
            echo "No coverage data to aggregate for ${conf}"
          fi
          { set +x; } 2>/dev/null
        elif [ "${TEST_TYPE}" == "baremetal" ]; then
          set -x
          cd ${chipyard}/${SIM_DIR}/generated-src/chipyard.harness.TestHarness.${HW_CONFIG}
          urg -dir coverage/*.vdb -format text -report ${BUILD_DIR}/run_logs/cov_overall_${HW_CONFIG} || echo "Coverage generation failed"
          { set +x; } 2>/dev/null
        fi
        
        echo "</testsuite>" >> $JUNIT_XML
      done

      echo "</testsuites>" >> ${JUNIT_XML}

      echo "" >> $TEST_SUMMARY_LOG
      echo "" >> $TEST_SUMMARY_LOG
      rm -rf ${BUILD_DIR}/run_logs/junit_tmp*.xml
      rm -rf ${BUILD_DIR}/run_logs/summary_tmp*.txt
      if [ "${FAIL}" -ne 0 ]; then
        echo "[ OVERALL STATUS -> FAILED ]" >> $TEST_SUMMARY_LOG
        exit 1
      else
        echo "[ OVERALL STATUS -> PASSED ]" >> $TEST_SUMMARY_LOG
      fi

      set -x

      end_section "Phase_3"

      echo "TEST EXECUTION FINISHED"

  artifacts:
      when: always
      paths:
        - log_*.txt
        - run_logs/
        - junit_report.xml
      reports:
        junit: junit_report.xml 




























