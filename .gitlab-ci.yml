synthesis:
  interruptible: false
  stage: test
  resource_group: ${CONCURRENCY_GROUP}
  rules:
    - if: '"$[[ inputs.RUN_PD ]]" == "true"'
  script:
    - *script_helpers
    - WORKSPACE=$(pwd)
    - echo "STEP workspace=${WORKSPACE}"
    - export chipyard=/tools/C/$USER/CI_CD_${CI_PIPELINE_ID}
    - export BUILD_ROOT=${chipyard}/vlsi/build
    - cd $chipyard
    - source ~/miniforge3/bin/activate
    - source ./env.sh
    - source /tools/C/ee194-sp26/bwrc-env.sh
    - LAST_SUCCESSFUL_PAR="/tools/C/$USER/pd-archives/last_successful_par.txt"
    - CONFIG_DIR="chipyard.harness.TestHarness.$[[ inputs.Config ]]-ChipTop"
    - SYN_RUNDIR="${BUILD_ROOT}/${CONFIG_DIR}/syn-rundir"
    - echo "STEP SYN_RUNDIR=${SYN_RUNDIR}"
    - mkdir -p ${WORKSPACE}/syn-rundir
    - |
      LAST_COMMIT=$(awk '{print $1}' ${LAST_SUCCESSFUL_PAR} 2>/dev/null || echo "none")
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ] && [ "$LAST_COMMIT" == "$CI_COMMIT_SHA" ]; then
        echo "No new commits since last successful nightly (${CI_COMMIT_SHA}). Nothing to do."
      else
        echo "Cleaning build directory for fresh run..."
        cd ${chipyard}/vlsi
        echo "Starting synthesis — Config:$[[ inputs.Config ]] Branch:${CI_COMMIT_BRANCH} Commit:${CI_COMMIT_SHA}"
        cd ${chipyard}/vlsi
        SECONDS=0
        mkdir -p ${WORKSPACE}/syn-rundir
        flock ${chipyard}/.scala_build.lock -c "make CONFIG=$[[ inputs.Config ]] verilog"
        make CONFIG=$[[ inputs.Config ]] syn 2>&1 | tee ${WORKSPACE}/syn-rundir/make_syn.log
        test ${PIPESTATUS[0]} -eq 0
        echo $SECONDS > ${WORKSPACE}/syn-rundir/syn_runtime.txt
        echo "Synthesis complete. Runtime:${SECONDS}s"

        # Copy reports and logs to workspace
        echo "STEP copying reports and logs to workspace..."
        mkdir -p ${WORKSPACE}/syn-rundir/reports
        cp -r ${SYN_RUNDIR}/reports/. ${WORKSPACE}/syn-rundir/reports/ || true
        cp ${SYN_RUNDIR}/genus.log ${WORKSPACE}/syn-rundir/ || true
        cp ${SYN_RUNDIR}/syn-output.json ${WORKSPACE}/syn-rundir/ || true
        cp ${SYN_RUNDIR}/syn-output-full.json ${WORKSPACE}/syn-rundir/ || true
        echo "STEP all copies done"
      fi

  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        WORKSPACE=$(pwd)
        BUILD_ROOT=/tools/C/$USER/CI_CD_${CI_PIPELINE_ID}/vlsi/build
        CONFIG_DIR="chipyard.harness.TestHarness.$[[ inputs.Config ]]-ChipTop"
        SYN_RUNDIR="${BUILD_ROOT}/${CONFIG_DIR}/syn-rundir"
        mkdir -p ${WORKSPACE}/syn-rundir/reports
        cp -r ${SYN_RUNDIR}/reports/. ${WORKSPACE}/syn-rundir/reports/ 2>/dev/null || true
        cp ${SYN_RUNDIR}/genus.log ${WORKSPACE}/syn-rundir/ 2>/dev/null || true
        echo "Synthesis FAILED — Config:$[[ inputs.Config ]] Branch:${CI_COMMIT_BRANCH} Commit:${CI_COMMIT_SHA}" > ${WORKSPACE}/syn-rundir/syn_FAILED.txt
        echo "Job URL: ${CI_JOB_URL}" >> ${WORKSPACE}/syn-rundir/syn_FAILED.txt
      fi

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "syn-rundir/reports/"
      - "syn-rundir/genus.log"
      - "syn-rundir/make_syn.log"
      - "syn-rundir/syn-output.json"
      - "syn-rundir/syn-output-full.json"
      - "syn-rundir/syn_runtime.txt"
      - "syn-rundir/syn_FAILED.txt"

par:
  interruptible: false
  stage: par
  needs: ["synthesis"]
  resource_group: ${CONCURRENCY_GROUP}
  rules:
    - if: '"$[[ inputs.RUN_PD ]]" == "true"'
  script:
    - *script_helpers
    - WORKSPACE=$(pwd)
    - echo "STEP workspace=${WORKSPACE}"
    - export chipyard=/tools/C/$USER/CI_CD_${CI_PIPELINE_ID}
    - export BUILD_ROOT=${chipyard}/vlsi/build
    - cd $chipyard
    - source ~/miniforge3/bin/activate
    - source ./env.sh
    - source /tools/C/ee194-sp26/bwrc-env.sh
    - TODAY=$(date +"%Y-%m-%d")
    - LAST_SUCCESSFUL_PAR="/tools/C/$USER/pd-archives/last_successful_par.txt"
    - CONFIG_DIR="chipyard.harness.TestHarness.$[[ inputs.Config ]]-ChipTop"
    - PAR_RUNDIR="${BUILD_ROOT}/${CONFIG_DIR}/par-rundir"
    - echo "STEP PAR_RUNDIR=${PAR_RUNDIR}"
    - |
      LAST_COMMIT=$(awk '{print $1}' ${LAST_SUCCESSFUL_PAR} 2>/dev/null || echo "none")
      if [ "$LAST_COMMIT" == "$CI_COMMIT_SHA" ]; then
        echo "No new commits since last successful nightly (${CI_COMMIT_SHA}). Nothing to do."
      else
        echo "Starting PAR — Config:$[[ inputs.Config ]] Branch:${CI_COMMIT_BRANCH} Commit:${CI_COMMIT_SHA}"
        cd ${chipyard}/vlsi
        SECONDS=0
        mkdir -p ${WORKSPACE}/par-rundir
        make CONFIG=$[[ inputs.Config ]] par 2>&1 | tee ${WORKSPACE}/par-rundir/make_par.log
        test ${PIPESTATUS[0]} -eq 0
        echo $SECONDS > ${WORKSPACE}/par-rundir/par_runtime.txt
        echo "PAR complete. Runtime:${SECONDS}s"

        # Copy final DB + generated-scripts + timingReports + logs to workspace
        echo "STEP copying PAR outputs to workspace..."
        mkdir -p ${WORKSPACE}/par-rundir/timingReports
        mkdir -p ${WORKSPACE}/par-rundir/generated-scripts
        cp -rL ${PAR_RUNDIR}/ChipTop_FINAL ${WORKSPACE}/par-rundir/ || true
        cp -r ${PAR_RUNDIR}/timingReports/. ${WORKSPACE}/par-rundir/timingReports/ || true
        cp -r ${PAR_RUNDIR}/generated-scripts/. ${WORKSPACE}/par-rundir/generated-scripts/ || true
        cp ${PAR_RUNDIR}/innovus.log ${WORKSPACE}/par-rundir/ || true
        cp ${PAR_RUNDIR}/par-output.json ${WORKSPACE}/par-rundir/ || true
        cp ${PAR_RUNDIR}/par-output-full.json ${WORKSPACE}/par-rundir/ || true
        cp ${PAR_RUNDIR}/mmmc.tcl ${WORKSPACE}/par-rundir/ || true
        cp ${PAR_RUNDIR}/floorplan.tcl ${WORKSPACE}/par-rundir/ || true
        cp ${PAR_RUNDIR}/par.tcl ${WORKSPACE}/par-rundir/ || true
        echo "STEP all PAR copies done"

        # Rewrite open_chip to be portable for any BWRC user
        printf '#!/bin/bash\n' > ${WORKSPACE}/par-rundir/generated-scripts/open_chip
        printf 'cd "$(dirname "$0")/.."\n' >> ${WORKSPACE}/par-rundir/generated-scripts/open_chip
        printf 'export CADENCE_HOME="/tools/cadence"\n' >> ${WORKSPACE}/par-rundir/generated-scripts/open_chip
        # Redacted: the license server addresses are replaced with <license-server>.
        printf 'export CDS_LIC_FILE="<license-server>"\n' >> ${WORKSPACE}/par-rundir/generated-scripts/open_chip
        printf 'export INNOVUS_BIN="/tools/cadence/DDI/DDI231_ISR4/bin/innovus"\n' >> ${WORKSPACE}/par-rundir/generated-scripts/open_chip
        printf '$INNOVUS_BIN -common_ui -win -files "$(dirname "$0")/open_chip.tcl"\n' >> ${WORKSPACE}/par-rundir/generated-scripts/open_chip
        chmod +x ${WORKSPACE}/par-rundir/generated-scripts/open_chip
        echo "STEP open_chip patched"
        # Patch open_chip.tcl to use ChipTop_FINAL instead of latest symlink
        sed -i 's|read_db latest|read_db ChipTop_FINAL|g' \
            ${WORKSPACE}/par-rundir/generated-scripts/open_chip.tcl
        echo "STEP open_chip.tcl patched"

        # Record last successful PAR commit
        mkdir -p /tools/C/$USER/pd-archives
        echo "${CI_COMMIT_SHA} | branch:${CI_COMMIT_BRANCH} | date:${TODAY} | config:$[[ inputs.Config ]]" > ${LAST_SUCCESSFUL_PAR}
        echo "Last successful PAR recorded."
      fi

  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        WORKSPACE=$(pwd)
        LAST_SUCCESSFUL_PAR="/tools/C/$USER/pd-archives/last_successful_par.txt"
        BUILD_ROOT=/tools/C/$USER/CI_CD_${CI_PIPELINE_ID}/vlsi/build
        CONFIG_DIR="chipyard.harness.TestHarness.$[[ inputs.Config ]]-ChipTop"
        PAR_RUNDIR="${BUILD_ROOT}/${CONFIG_DIR}/par-rundir"
        mkdir -p ${WORKSPACE}/par-rundir/timingReports
        cp -r ${PAR_RUNDIR}/timingReports/. ${WORKSPACE}/par-rundir/timingReports/ 2>/dev/null || true
        cp ${PAR_RUNDIR}/innovus.log ${WORKSPACE}/par-rundir/ 2>/dev/null || true
        echo "PAR FAILED — Config:$[[ inputs.Config ]] Branch:${CI_COMMIT_BRANCH} Commit:${CI_COMMIT_SHA}" > ${WORKSPACE}/par-rundir/par_FAILED.txt
        echo "Job URL: ${CI_JOB_URL}" >> ${WORKSPACE}/par-rundir/par_FAILED.txt
        if [ -f "${LAST_SUCCESSFUL_PAR}" ]; then
          echo "Last successful PAR was:" >> ${WORKSPACE}/par-rundir/par_FAILED.txt
          cat ${LAST_SUCCESSFUL_PAR} >> ${WORKSPACE}/par-rundir/par_FAILED.txt
        else
          echo "No previous successful PAR on record." >> ${WORKSPACE}/par-rundir/par_FAILED.txt
        fi
      fi

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "par-rundir/"


drc:
  interruptible: false
  stage: drc
  needs: ["par"]
  resource_group: ${CONCURRENCY_GROUP}
  allow_failure: true
  rules:
    - if: '"$[[ inputs.RUN_PD ]]" == "true"'
  script:
    - WORKSPACE=$(pwd)
    - export chipyard=/tools/C/$USER/CI_CD_${CI_PIPELINE_ID}
    - export BUILD_ROOT=${chipyard}/vlsi/build
    - cd $chipyard
    - source ~/miniforge3/bin/activate
    - source ./env.sh
    - source /tools/C/ee194-sp26/bwrc-env.sh
    - CONFIG_DIR="chipyard.harness.TestHarness.$[[ inputs.Config ]]-ChipTop"
    - DRC_RUNDIR="${BUILD_ROOT}/${CONFIG_DIR}/drc-rundir"
    - |
      # Install hammer-mentor-plugins
      pip install -e ${chipyard}/vlsi/hammer-mentor-plugins
      # Set up Calibre environment
      export CALIBRE_SKIP_OS_CHECKS=1
      export USE_CALIBRE_VCO=aoi
      # Redacted: the license server addresses are replaced with <license-server>.
      export MGLS_LICENSE_FILE="<license-server>"
      echo "Starting DRC — Config:$[[ inputs.Config ]] Commit:${CI_COMMIT_SHA}"
      cd ${chipyard}/vlsi
      make CONFIG=$[[ inputs.Config ]] redo-par-to-drc
      make CONFIG=$[[ inputs.Config ]] redo-drc 2>&1 | tee ${WORKSPACE}/drc_run.log
      test ${PIPESTATUS[0]} -eq 0
      # Copy DRC results to workspace
      mkdir -p ${WORKSPACE}/drc-rundir
      cp -r ${DRC_RUNDIR}/. ${WORKSPACE}/drc-rundir/ || true
      echo "DRC complete."

  after_script:
    - |
      if [ "$CI_JOB_STATUS" == "failed" ]; then
        WORKSPACE=$(pwd)
        BUILD_ROOT=/tools/C/$USER/CI_CD_${CI_PIPELINE_ID}/vlsi/build
        CONFIG_DIR="chipyard.harness.TestHarness.$[[ inputs.Config ]]-ChipTop"
        DRC_RUNDIR="${BUILD_ROOT}/${CONFIG_DIR}/drc-rundir"
        mkdir -p ${WORKSPACE}/drc-rundir
        cp -r ${DRC_RUNDIR}/. ${WORKSPACE}/drc-rundir/ 2>/dev/null || true
        echo "DRC FAILED — Config:$[[ inputs.Config ]] Commit:${CI_COMMIT_SHA}" > ${WORKSPACE}/drc-rundir/drc_FAILED.txt
        echo "Job URL: ${CI_JOB_URL}" >> ${WORKSPACE}/drc-rundir/drc_FAILED.txt
      fi

  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - "drc-rundir/"
      - "drc_run.log"

































